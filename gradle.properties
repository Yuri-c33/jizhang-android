android.useAndroidX=true
android.enableJetifier=false
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
# 不要把本机 JDK 绝对路径写进这个文件：仓库是公开的，会连带暴露用户名与目录结构，
# 而且别人 clone 后那条路径根本不存在、构建直接失败。需要指定时用下面任一方式：
#   1) 设置 JAVA_HOME 环境变量（Gradle 自动采用）
#   2) 写进用户级 ~/.gradle/gradle.properties:  org.gradle.java.home=<你的 JDK 路径>
ksp.useKSP2=true
android.suppressUnsupportedCompileSdk=37.0
org.gradle.caching=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false
